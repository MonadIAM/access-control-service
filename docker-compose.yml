version: "3.9"

x-base: &base
    restart: on-failure

name: ${SERVICE_NAME}

services:
    postgresql:
        <<: *base
        image: ${POSTGRESQL_IMAGE:?}
        container_name: ${SERVICE_NAME}-postgres
        environment:
            POSTGRES_DB: ${POSTGRESQL_NAME}
            POSTGRES_USER: ${POSTGRESQL_USER}
            POSTGRES_PASSWORD: ${POSTGRESQL_PASS}
        ports:
            - "${POSTGRESQL_PORT}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - internal

    redis:
        <<: *base
        image: ${REDIS_IMAGE:?}
        container_name: ${SERVICE_NAME}-redis
        ports:
            - "${REDIS_PORT}:6379"
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
        volumes:
            - redis_data:/data
        networks:
            - internal

    service:
        <<: *base
        build:
            context: .
            args:
                BASE_IMAGE: ${APP_BASE_IMAGE:?}
        image: ${SERVICE_NAME}:latest
        container_name: ${SERVICE_NAME}-app
        env_file:
            - .env
        ports:
            - "${APP_PORT}:${APP_PORT}"
        depends_on:
            - postgresql
            - redis
        volumes:
            - uploads_data:/app/uploads
        networks:
            internal:
            kafka_net:
            monitoring-shared:
                aliases:
                    - access-control-service
        stop_grace_period: 1s
        logging:
            driver: loki
            options:
                loki-url: "http://host.docker.internal:3100/loki/api/v1/push"
                loki-external-labels: "job=access-control-service,container_name={{.Name}}"
                loki-batch-size: "100"
                loki-retries: "3"
                loki-timeout: "1s"
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${APP_PORT}/api/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s

volumes:
    postgres_data: {}
    redis_data: {}
    uploads_data: {}

networks:
    internal:
        driver: bridge
    kafka_net:
        external: true
        name: ${DOCKER_NETWORK_NAME:-kafka-net}
    monitoring-shared:
        external: true
        name: monitoring-network

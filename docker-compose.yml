x-base: &base
  restart: on-failure

name: ${SERVICE_NAME:?}

services:
  vault-bootstrap:
    image: ${VAULT_IMAGE:?}
    container_name: ${SERVICE_NAME:?}-vault-bootstrap
    env_file:
      - .env
    environment:
      VAULT_ADDR: "https://vault:${VAULT_PORT:?}"
      VAULT_CACERT: /vault/tls/ca.crt
      VAULT_TOKEN: ${VAULT_PROVISIONER_TOKEN:?}
    volumes:
      - ./docker/vault/bootstrap.sh:/bootstrap.sh:ro
      - vault_ca:/vault/tls:ro
      - vault_agent_config:/vault/config
      - vault_agent_bootstrap:/vault/agent-bootstrap
    entrypoint: ["sh", "/bootstrap.sh"]
    networks:
      vault_net:

  vault-agent:
    image: ${VAULT_IMAGE:?}
    container_name: ${SERVICE_NAME:?}-vault-agent
    restart: always
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: "https://vault:${VAULT_PORT:?}"
      VAULT_CACERT: /vault/tls/ca.crt
    entrypoint: ["vault"]
    command: ["agent", "-config=/agent.hcl"]
    volumes:
      - ./docker/vault/agent.hcl:/agent.hcl:ro
      - vault_ca:/vault/tls:ro
      - vault_agent_config:/vault/config:ro
      - vault_agent_bootstrap:/vault/agent-bootstrap
      - vault_agent_token:/vault/token
      - application_secrets:/secrets/application
    networks:
      vault_net:
      internal:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /secrets/application/postgresql_username && test -f /secrets/application/postgresql_password && test -f /secrets/application/redis_password && test -f /secrets/application/kafka_sasl_password",
        ]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s

  consul-register:
    image: ${CONSUL_IMAGE:?}
    container_name: ${SERVICE_NAME:?}-consul-register
    environment:
      CONSUL_HTTP_ADDR: "http://consul:8500"
    volumes:
      - ./docker/consul/service.hcl:/consul/service.hcl:ro
      - ./docker/consul/register-service.sh:/register-service.sh:ro
    entrypoint: ["sh", "/register-service.sh"]
    networks:
      consul_net:

  service:
    <<: *base
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        BASE_IMAGE: ${APP_BASE_IMAGE:?}
    image: ${SERVICE_NAME:?}:latest
    container_name: ${SERVICE_NAME:?}-app
    env_file:
      - .env
    ports:
      - "${APP_PORT:?}:${APP_PORT:?}"
    depends_on:
      vault-agent:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - application_secrets:/vault/secrets:ro
      - service_tls:/tls:ro
      - ./docker/app/entrypoint.sh:/usr/local/bin/vault-entrypoint.sh:ro
    entrypoint: ["sh", "/usr/local/bin/vault-entrypoint.sh"]
    networks:
      monitoring_net:
        aliases:
          - access-control-service
      kafka_net:
      postgres_net:
      redis_net:
      internal:
      consul_net:
        aliases:
          - access-control-service-connect
    stop_grace_period: 1s
    logging:
      driver: loki
      options:
        loki-url: "http://host.docker.internal:3100/loki/api/v${API_VERSION:?}/push"
        loki-external-labels: "job=access-control-service,container_name={{.Name}}"
        loki-batch-size: "100"
        loki-retries: "3"
        loki-timeout: "1s"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${APP_PORT:?}/api/v${API_VERSION:?}/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  consul-connect:
    <<: *base
    image: ${CONSUL_ENVOY_IMAGE:?}
    container_name: ${SERVICE_NAME:?}-connect
    depends_on:
      consul-register:
        condition: service_completed_successfully
      service:
        condition: service_started
    environment:
      CONSUL_HTTP_ADDR: "http://consul:8500"
      CONSUL_GRPC_ADDR: "http://consul:8502"
    command:
      [
        "connect",
        "envoy",
        "-sidecar-for=access-control-service",
        "-http-addr=http://consul:8500",
        "-grpc-addr=http://consul:8502",
        "-admin-bind=127.0.0.1:19000",
        "--",
        "--log-level",
        "warn",
      ]
    network_mode: "service:service"

  ops:
    build:
      context: .
      dockerfile: docker/ops/Dockerfile
      args:
        BASE_IMAGE: ${APP_BASE_IMAGE:?}
    image: ${SERVICE_NAME:?}-ops:latest
    profiles:
      - ops
    env_file:
      - .env
    depends_on:
      vault-agent:
        condition: service_healthy
    volumes:
      - ./src/infrastructure/database/migrations:/app/src/infrastructure/database/migrations
      - application_secrets:/vault/secrets:ro
      - service_tls:/tls:ro
    networks:
      postgres_net:
      redis_net:

volumes:
  service_tls:
    external: true
    name: ${DOCKER_VOLUME_SERVICE_TLS:?}
  vault_ca:
    external: true
    name: ${DOCKER_VOLUME_VAULT_CA:?}
  vault_agent_bootstrap: {}
  application_secrets: {}
  vault_agent_config: {}
  vault_agent_token: {}
  uploads_data: {}

networks:
  internal:
    driver: bridge
  monitoring_net:
    external: true
    name: ${DOCKER_NETWORK_MONITORING:?}
  postgres_net:
    external: true
    name: ${DOCKER_NETWORK_POSTGRES:?}
  consul_net:
    external: true
    name: ${DOCKER_NETWORK_CONSUL:?}
  kafka_net:
    external: true
    name: ${DOCKER_NETWORK_KAFKA:?}
  redis_net:
    external: true
    name: ${DOCKER_NETWORK_REDIS:?}
  vault_net:
    external: true
    name: ${DOCKER_NETWORK_VAULT:?}

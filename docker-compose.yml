x-base: &base
  restart: on-failure

name: ${SERVICE_NAME}

services:
  postgresql-primary:
    <<: *base
    image: ${POSTGRES_IMAGE:?}
    container_name: ${SERVICE_NAME}-postgres-primary
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_CONTAINER_PORT}"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./docker/postgres/setup-replication.sh:/docker-entrypoint-initdb.d/99-setup-replication.sh:ro
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1 -p ${POSTGRES_CONTAINER_PORT}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgresql-replica:
    <<: *base
    image: ${POSTGRES_IMAGE:?}
    container_name: ${SERVICE_NAME}-postgres-replica
    env_file:
      - .env
    environment:
      POSTGRES_PRIMARY_HOST: postgresql-primary
      POSTGRES_PRIMARY_PORT: ${POSTGRES_CONTAINER_PORT}
    ports:
      - "${POSTGRES_REPLICA_PORT}:${POSTGRES_CONTAINER_PORT}"
    depends_on:
      postgresql-primary:
        condition: service_healthy
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./docker/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    command: ["bash", "/usr/local/bin/replica-entrypoint.sh"]
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1 -p ${POSTGRES_CONTAINER_PORT} && PGPASSWORD=${POSTGRES_PASSWORD} psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1 -p ${POSTGRES_CONTAINER_PORT} -tAc \"SELECT pg_is_in_recovery()\" | grep -q t",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-connect:
    <<: *base
    image: ${KAFKA_CONNECT_IMAGE:?}
    container_name: ${SERVICE_NAME}-kafka-connect
    ports:
      - "${KAFKA_CONNECT_PORT}:8083"
    env_file:
      - .env
    environment:
      BOOTSTRAP_SERVERS: ${KAFKA_BROKER}
      GROUP_ID: ${SERVICE_NAME}-connect
      CONFIG_STORAGE_TOPIC: ${SERVICE_NAME}-connect-configs
      OFFSET_STORAGE_TOPIC: ${SERVICE_NAME}-connect-offsets
      STATUS_STORAGE_TOPIC: ${SERVICE_NAME}-connect-status
    depends_on:
      postgresql-primary:
        condition: service_healthy
    networks:
      - internal
      - kafka_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  debezium-init:
    image: ${DEBEZIUM_INIT_IMAGE:?}
    container_name: ${SERVICE_NAME}-debezium-init
    env_file:
      - .env
    volumes:
      - ./docker/debezium/connector.projection-journal.json.tpl:/connector.projection-journal.json.tpl:ro
      - ./docker/debezium/connector.outbox.json.tpl:/connector.outbox.json.tpl:ro
      - ./docker/debezium/init.sh:/init.sh:ro
    depends_on:
      kafka-connect:
        condition: service_healthy
    entrypoint: ["sh", "/init.sh"]
    networks:
      - internal

  redis:
    <<: *base
    image: ${REDIS_IMAGE:?}
    container_name: ${SERVICE_NAME}-redis
    ports:
      - "${REDIS_PORT}:${REDIS_CONTAINER_PORT}"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - internal

  service:
    <<: *base
    build:
      context: .
      args:
        BASE_IMAGE: ${APP_BASE_IMAGE:?}
    image: ${SERVICE_NAME}:latest
    container_name: ${SERVICE_NAME}-app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgresql-primary
      POSTGRES_WRITE_HOST: postgresql-primary
      POSTGRES_READ_HOST: postgresql-replica
      REDIS_HOST: redis
      POSTGRES_WRITE_PORT: ${POSTGRES_CONTAINER_PORT}
      POSTGRES_READ_PORT: ${POSTGRES_CONTAINER_PORT}
      POSTGRES_PORT: ${POSTGRES_CONTAINER_PORT}
      REDIS_PORT: ${REDIS_CONTAINER_PORT}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      postgresql-primary:
        condition: service_healthy
      postgresql-replica:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads
    networks:
      internal:
      kafka_net:
      monitoring-shared:
        aliases:
          - access-control-service
    stop_grace_period: 1s
    logging:
      driver: loki
      options:
        loki-url: "http://host.docker.internal:3100/loki/api/v${API_VERSION}/push"
        loki-external-labels: "job=access-control-service,container_name={{.Name}}"
        loki-batch-size: "100"
        loki-retries: "3"
        loki-timeout: "1s"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${APP_PORT}/api/v${API_VERSION}/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_primary_data: {}
  postgres_replica_data: {}
  redis_data: {}
  uploads_data: {}

networks:
  internal:
    driver: bridge
  kafka_net:
    external: true
    name: ${DOCKER_NETWORK_NAME:-kafka-net}
  monitoring-shared:
    external: true
    name: monitoring-network

title = "project gitleaks config"

[extend]
useDefault = true # Uses the standard built-in gitleaks config as a base.



[[rules]]
id = "internal-service-token"

description = "Internal service token in code or configs"

regex = '''(?i)(internal[_-]?service[_-]?token)\s*[:=]\s*["']?([A-Za-z0-9_\-]{24,64})["']?'''

secretGroup = 2

entropy = 3.5

path = '''src/.*\.(ts|js|jsx|tsx|ya?ml|json)$'''

keywords = [
  "internal",
  "service",
  "token",
]

tags = [
  "internal",
  "token",
]

  # Local allowlist for THIS SPECIFIC rule: internal-service-token.
  # Ignores fake/example tokens in tests and docs.
  [[rules.allowlists]]
  description = "Allow fake internal tokens in tests and docs"

  condition = "OR"

  regexTarget = "line"

  paths = [
    '''tests/.*''',
    '''docs/.*''',
  ]

  regexes = [
    '''FAKE_TOKEN''',
  ]

  [[rules.allowlists]]
  description = "Allow internal token example in README"

  condition = "AND"
  regexTarget = "line"

  paths = [
    '''README\.md''',
  ]

  regexes = [
    '''INTERNAL_SERVICE_TOKEN_EXAMPLE''',
  ]



# Global allowlist — applies to ALL rules, except those
# explicitly scoped via targetRules in [[allowlists]].
[[allowlists]]
description = "global allowlist"

regexTarget = "match"

regexes = [
  '''219-09-9999''',
  '''078-05-1120''',
  '''(9[0-9]{2}|666)-\d{2}-\d{4}''',
]

paths = [
  '''gitleaks\.toml''',
  '''(.*?)(jpg|jpeg|png|gif|pdf|docx?|xlsx?|pptx?|bin|svg|socket)$''',
]

stopwords = [
  '''client''',
  '''endpoint''',
]



# [[allowlists]] — newer mechanism (v8.25+), allows a single allowlist
# to be applied to multiple rules via targetRules.
[[allowlists]]
description = "Shared allowlist for noisy test fixtures"

targetRules = [
  "internal-service-token",
  "generic-api-key",
]

paths = [
  '''tests/fixtures/.*''',
]
